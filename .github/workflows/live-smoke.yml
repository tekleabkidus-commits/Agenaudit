name: Production release verification

on:
  push:
    branches: [main]
    paths:
      - 'public/agenaudit-release.txt'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for latest release marker on Laravel Cloud
        run: |
          url="https://agenaudit-production-mfxsno.laravel.cloud/agenaudit-release.txt"
          expected="agenaudit-fast-agent-reading-2026-10-09-8ef6a0bd"
          for attempt in $(seq 1 24); do
            actual=$(curl -fLsS --max-time 20 "$url" 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              echo "Correct production release marker found (attempt $attempt)."
              exit 0
            fi
            echo "Production does not yet report the requested release (attempt $attempt/24)."
            sleep 15
          done
          echo "The requested GitHub release could not be confirmed on Laravel Cloud."
          exit 1
      - name: Check production health and login
        run: |
          for route in up login; do
            url="https://agenaudit-production-mfxsno.laravel.cloud/$route"
            status=$(curl -LsS --max-time 25 --output /dev/null --write-out '%{http_code}' "$url") || status="000"
            echo "Production /$route returned HTTP $status"
            test "$status" = "200"
          done
